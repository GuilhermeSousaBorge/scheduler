spring:
  application:
    name: scheduler
  profiles:
    active:
     - ${SPRING_PROFILES_ACTIVE:develop}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations:
      - classpath:db/migration