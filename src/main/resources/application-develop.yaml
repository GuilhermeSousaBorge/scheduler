spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/car-wash
    username: localhost
    password: localhost
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
logging:
  level:
    org.flywaydb: info
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}}